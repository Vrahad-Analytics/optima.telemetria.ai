name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

# Publishing to Maven Central:
#   - push to main    -> publishes a -SNAPSHOT to central.sonatype.com snapshots
#   - push a v* tag   -> publishes a signed release to Maven Central
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SONATYPE_USERNAME  username half of the Central Portal user token
#   SONATYPE_PASSWORD  password half of the Central Portal user token
#   PGP_SECRET         base64 of `gpg --armor --export-secret-keys <KEY_ID> | base64`
#   PGP_PASSPHRASE     passphrase for that GPG key

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags so the build can read git tags for the version
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Publish
        run: |
          if [[ -z "${SONATYPE_USERNAME}" || -z "${SONATYPE_PASSWORD}" ]]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::SONATYPE_USERNAME and SONATYPE_PASSWORD are required for tag releases."
              exit 1
            fi
            echo "::notice::Skipping snapshot publish because SONATYPE credentials are not configured."
            exit 0
          fi
          sbt ci-release
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
